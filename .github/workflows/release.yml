name: Release

# 推送 v* tag 时自动出包并建 GitHub Release；
# 也支持手动重跑某个已存在的 tag（Release 会被覆盖更新）。
on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: '已存在的 tag（例如 v1.1.0）'
                required: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.event.inputs.tag || github.ref }}

            -   uses: actions/setup-node@v4
                with:
                    node-version: 22

            # tag 与 package.json 版本必须一致，避免 v1.1.1 的 tag 挂着 1.1.0 的包
            -   name: Verify tag matches package version
                id: meta
                run: |
                    TAG="${{ github.event.inputs.tag || github.ref_name }}"
                    VERSION="${TAG#v}"
                    PKG_VERSION="$(node -p "require('./package.json').version")"
                    echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                    if [ "$VERSION" != "$PKG_VERSION" ]; then
                        echo "::error::tag $TAG 与 package.json 的版本 $PKG_VERSION 不一致"
                        exit 1
                    fi

            # 打 tag 前忘了跑 sync-version 的话，这里会失败
            -   name: Version files are in sync
                run: |
                    node scripts/sync-version.js
                    git diff --exit-code

            -   name: Unit tests
                run: npm test

            -   name: Build zip
                run: node scripts/pack.js

            # Release 正文来自 CHANGELOG，避免手写第二份
            -   name: Extract release notes
                run: node scripts/extract-changelog.js "${{ steps.meta.outputs.version }}" > release-notes.md

            -   name: Publish release
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    TAG="${{ steps.meta.outputs.tag }}"
                    ZIP="Smart-Linkify-$TAG.zip"
                    if gh release view "$TAG" > /dev/null 2>&1; then
                        echo "Release 已存在，覆盖附件与正文"
                        gh release upload "$TAG" "$ZIP" --clobber
                        gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
                    else
                        gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "$ZIP"
                    fi
                    echo "### 发布完成：[$TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
