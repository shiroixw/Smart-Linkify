<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loopwork Docs — Release notes</title>
<style>
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; }
	body {
		background: #ffffff;
		color: #1f2328;
		font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	.topbar {
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 14px 40px;
		border-bottom: 1px solid #e6e8eb;
	}
	.logo {
		width: 22px; height: 22px; border-radius: 6px;
		background: linear-gradient(135deg, #3b82f6, #1d4ed8);
	}
	.brand { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
	.brand span { color: #6b7280; font-weight: 400; }

	.page { max-width: 720px; margin: 0 auto; padding: 34px 0 0; }
	.eyebrow {
		font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
		text-transform: uppercase; color: #2563eb; margin-bottom: 8px;
	}
	h1 { font-size: 26px; line-height: 1.25; margin: 0 0 14px; letter-spacing: -0.02em; }
	.lead { color: #4b5563; margin: 0 0 8px; }
	a { color: #2563eb; text-decoration: underline; text-underline-offset: 3px; }

	.composer {
		margin-top: 26px;
		border: 1px solid #e0e3e8;
		border-radius: 12px;
		background: #fff;
		box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
	}
	.composer__head {
		display: flex; align-items: center; gap: 10px;
		padding: 12px 16px 0;
		font-size: 13px; color: #6b7280;
	}
	.avatar {
		width: 24px; height: 24px; border-radius: 50%;
		background: #dbeafe; color: #1d4ed8;
		font-size: 11px; font-weight: 700;
		display: flex; align-items: center; justify-content: center;
	}
	.composer__body {
		min-height: 76px;
		padding: 12px 16px;
		font-size: 15px;
		line-height: 1.6;
		outline: none;
		white-space: pre-wrap;
		word-break: break-word;
	}
	.composer__body .caret {
		display: inline-block;
		width: 1px; height: 18px;
		background: #2563eb;
		vertical-align: -3px;
		animation: blink 1s steps(1) infinite;
	}
	@keyframes blink { 50% { opacity: 0; } }
	.composer__foot {
		display: flex; justify-content: flex-end; gap: 8px;
		padding: 0 16px 14px;
	}
	.btn {
		border: 0; border-radius: 8px;
		padding: 8px 16px; font-size: 13px; font-weight: 600;
		background: #eff1f4; color: #4b5563;
	}
	.btn--primary { background: #2563eb; color: #fff; }
	.btn.is-active { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.22); }

	.thread { margin-top: 22px; }
	.comment {
		display: flex; gap: 12px;
		padding: 14px 0;
		border-top: 1px solid #eef0f3;
		opacity: 0;
		transform: translateY(6px);
		transition: opacity 200ms ease, transform 200ms ease;
	}
	.comment.is-in { opacity: 1; transform: none; }
	.comment__meta { font-size: 13px; color: #6b7280; margin-bottom: 2px; }
	.comment__meta b { color: #1f2328; font-weight: 600; }
	.comment__text { font-size: 15px; }
	.link-pop { animation: pop 420ms ease; }
	@keyframes pop {
		0% { background: rgba(37, 99, 235, 0.16); }
		100% { background: transparent; }
	}
</style>
</head>
<body>
	<div class="topbar">
		<div class="logo"></div>
		<div class="brand">Loopwork <span>/ Docs</span></div>
	</div>

	<div class="page">
		<div class="eyebrow">Release notes</div>
		<h1>What shipped in v2.4</h1>
		<p class="lead">
			Search now covers archived notebooks, and the editor autosaves every 5 seconds.
			Full changelog: github.com/loopwork/docs/releases
		</p>
		<p class="lead">
			Migration guide lives at docs.loopwork.dev/migrate — read it before upgrading.
		</p>

		<div class="composer">
			<div class="composer__head">
				<div class="avatar">AR</div>
				<span>Comment as Alex Rivera</span>
			</div>
			<div class="composer__body" id="composer"><span class="caret"></span></div>
			<div class="composer__foot">
				<button class="btn">Cancel</button>
				<button class="btn btn--primary" id="post">Post</button>
			</div>
		</div>

		<div class="thread" id="thread"></div>
	</div>

<script>
	// 演示脚本：模拟真实用户「输入评论 → 发布 → 新内容里的裸链接被实时转换」
	const TEXT = 'Heads up: the staging build is at staging.loopwork.dev and the API docs moved to api.loopwork.dev/v2';
	const composer = document.getElementById('composer');
	const caret = composer.querySelector('.caret');
	const postBtn = document.getElementById('post');
	const thread = document.getElementById('thread');

	const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

	// 录制时由外部置位 data-demo-start，保证视频从干净状态开始
	async function waitForStart() {
		while (document.documentElement.dataset.demoStart !== '1') {
			await sleep(40);
		}
	}

	async function type() {
		await waitForStart();
		await sleep(900);
		for (const ch of TEXT) {
			composer.insertBefore(document.createTextNode(ch), caret);
			await sleep(ch === ' ' ? 46 : 26 + Math.random() * 30);
		}
		await sleep(260);
		postBtn.classList.add('is-active');
		await sleep(220);
		postBtn.classList.remove('is-active');

		// 发布：新评论以纯文本插入 DOM（此时链接还不可点）
		const wrap = document.createElement('div');
		wrap.className = 'comment';
		wrap.innerHTML =
			'<div class="avatar">AR</div><div><div class="comment__meta"><b>Alex Rivera</b> · just now</div>' +
			'<div class="comment__text">' +
			TEXT.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
			'</div></div>';
		thread.appendChild(wrap);
		composer.textContent = '';
		composer.appendChild(caret);
		requestAnimationFrame(() => wrap.classList.add('is-in'));

		// 扩展的 MutationObserver 会在这之后把裸 URL 变成可点链接
		const commentText = wrap.querySelector('.comment__text');
		const timer = setInterval(() => {
			if (commentText.querySelector('a')) {
				clearInterval(timer);
				commentText.querySelectorAll('a').forEach((a) => {
					a.classList.add('link-pop');
				});
			}
		}, 50);
	}

	type();
</script>
</body>
</html>
