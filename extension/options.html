<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title data-i18n="options.title">设置 - 智能超链接识别</title>
		<link rel="stylesheet" href="shared/tokens.css" />
		<link rel="stylesheet" href="options.css" />
		<script src="shared/theme.js"></script>
	</head>
	<body>
		<div class="container">
			<header>
				<button
					class="theme-toggle"
					id="themeToggle"
					data-i18n-title="common.switchTheme"
					data-i18n-aria-label="common.switchTheme"
					title="切换主题"
					aria-label="切换主题"
				>
					<svg
						class="icon icon-moon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
						focusable="false"
					>
						<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
					</svg>
					<svg
						class="icon icon-sun"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
						focusable="false"
					>
						<circle cx="12" cy="12" r="4" />
						<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
					</svg>
				</button>
				<button
					class="lang-toggle"
					id="langToggle"
					data-i18n-title="common.switchLang"
					title="切换语言"
				>
					EN
				</button>
				<h1 data-i18n="options.title">智能超链接识别 - 设置</h1>
				<p class="subtitle" data-i18n="options.subtitle">
					Smart Linkify – Instant hyperlink conversion Settings
				</p>
			</header>

			<main>
				<section class="section">
					<h2 data-i18n="options.basic.title">基本设置</h2>
					<div class="option-item">
						<div class="label-row">
							<label class="option-label">
								<input type="checkbox" id="openInNewTab" />
								<span data-i18n="options.basic.newTab"
									>在新标签页中打开链接</span
								>
							</label>
							<button
								type="button"
								class="help-tip"
								data-i18n-aria-label="common.help"
								aria-label="说明"
								aria-describedby="help-newTab"
							>
								<span class="help-tip-mark" aria-hidden="true">?</span>
								<span
									id="help-newTab"
									class="help-tip-text"
									role="tooltip"
									data-i18n="options.basic.newTab.desc"
									>启用后，点击转换的链接将在新标签页中打开</span
								>
							</button>
						</div>
					</div>
				</section>

				<section class="section">
					<h2 data-i18n="options.appearance.title">外观设置</h2>
					<div class="option-item">
						<div class="label-row">
							<label
								class="option-label-inline"
								data-i18n="options.appearance.theme"
								>主题模式</label
							>
							<button
								type="button"
								class="help-tip"
								data-i18n-aria-label="common.help"
								aria-label="说明"
								aria-describedby="help-theme"
							>
								<span class="help-tip-mark" aria-hidden="true">?</span>
								<span
									id="help-theme"
									class="help-tip-text"
									role="tooltip"
									data-i18n="options.appearance.theme.desc"
									>选择插件界面的主题模式，“跟随系统”将自动适配您的操作系统设置</span
								>
							</button>
						</div>
						<div class="theme-options">
							<label class="radio-label">
								<input
									type="radio"
									name="theme"
									value="auto"
									id="themeAuto"
								/>
								<span data-i18n="options.appearance.theme.auto"
									>跟随系统</span
								>
							</label>
							<label class="radio-label">
								<input
									type="radio"
									name="theme"
									value="light"
									id="themeLight"
								/>
								<span data-i18n="options.appearance.theme.light"
									>浅色模式</span
								>
							</label>
							<label class="radio-label">
								<input
									type="radio"
									name="theme"
									value="dark"
									id="themeDark"
								/>
								<span data-i18n="options.appearance.theme.dark"
									>深色模式</span
								>
							</label>
						</div>
					</div>
					<div class="option-item">
						<div class="label-row">
							<label
								class="option-label-inline"
								data-i18n="options.appearance.lang"
								>界面语言</label
							>
							<button
								type="button"
								class="help-tip"
								data-i18n-aria-label="common.help"
								aria-label="说明"
								aria-describedby="help-lang"
							>
								<span class="help-tip-mark" aria-hidden="true">?</span>
								<span
									id="help-lang"
									class="help-tip-text"
									role="tooltip"
									data-i18n="options.appearance.lang.desc"
									>选择插件界面语言，“自动检测”将根据浏览器语言自动选择</span
								>
							</button>
						</div>
						<div class="theme-options">
							<label class="radio-label">
								<input
									type="radio"
									name="lang"
									value="auto"
									id="langAuto"
								/>
								<span data-i18n="options.appearance.lang.auto"
									>自动检测</span
								>
							</label>
							<label class="radio-label">
								<input
									type="radio"
									name="lang"
									value="zh-CN"
									id="langZh"
								/>
								<span data-i18n="options.appearance.lang.zh"
									>简体中文</span
								>
							</label>
							<label class="radio-label">
								<input
									type="radio"
									name="lang"
									value="en"
									id="langEn"
								/>
								<span data-i18n="options.appearance.lang.en"
									>English</span
								>
							</label>
						</div>
					</div>
				</section>

				<section class="section">
					<h2>
						<span data-i18n="options.whitelist.title">已启用的网站</span>
						<button
							type="button"
							class="help-tip"
							data-i18n-aria-label="common.help"
							aria-label="说明"
							aria-describedby="help-whitelist"
						>
							<span class="help-tip-mark" aria-hidden="true">?</span>
							<span
								id="help-whitelist"
								class="help-tip-text"
								role="tooltip"
							>
								<span data-i18n="options.whitelist.desc"
									>仅在以下网站上启用链接转换功能（每行一个域名）</span
								>
								<span data-i18n="options.whitelist.hint"
									>提示：只需输入域名，子域名将自动包含（如输入 github.com 也会匹配 docs.github.com）</span
								>
							</span>
						</button>
					</h2>
					<textarea
						id="whitelist"
						rows="6"
						data-i18n-placeholder="options.whitelist.placeholder"
						placeholder="例如：&#10;github.com&#10;stackoverflow.com&#10;example.com"
					></textarea>
				</section>

				<section class="section">
					<h2>
						<span data-i18n="options.excludedTags.title"
							>排除的 HTML 标签</span
						>
						<button
							type="button"
							class="help-tip"
							data-i18n-aria-label="common.help"
							aria-label="说明"
							aria-describedby="help-excludedTags"
						>
							<span class="help-tip-mark" aria-hidden="true">?</span>
							<span
								id="help-excludedTags"
								class="help-tip-text"
								role="tooltip"
							>
								<span data-i18n="options.excludedTags.desc"
									>以下标签内的文本不会被转换（用逗号分隔）</span
								>
								<span data-i18n="options.excludedTags.hint"
									>默认排除：SCRIPT, STYLE, NOSCRIPT, TEXTAREA, PRE,
									CODE, A</span
								>
							</span>
						</button>
					</h2>
					<input
						type="text"
						id="excludedTags"
						data-i18n-placeholder="options.excludedTags.placeholder"
						placeholder="SCRIPT, STYLE, PRE, CODE, A"
					/>
				</section>

				<section class="section">
					<h2>
						<span data-i18n="options.urlMatch.title">URL 匹配设置</span>
						<button
							type="button"
							class="help-tip"
							data-i18n-aria-label="common.help"
							aria-label="说明"
							aria-describedby="help-urlMatch"
						>
							<span class="help-tip-mark" aria-hidden="true">?</span>
							<span
								id="help-urlMatch"
								class="help-tip-text"
								role="tooltip"
								data-i18n="options.urlMatch.desc"
								>配置 URL 识别的精确程度</span
							>
						</button>
					</h2>
					<div class="option-item">
						<div class="label-row">
							<label class="option-label">
								<input type="checkbox" id="strictMode" checked />
								<span data-i18n="options.urlMatch.strictMode"
									>启用精确匹配模式</span
								>
							</label>
							<button
								type="button"
								class="help-tip"
								data-i18n-aria-label="common.help"
								aria-label="说明"
								aria-describedby="help-strictMode"
							>
								<span class="help-tip-mark" aria-hidden="true">?</span>
								<span
									id="help-strictMode"
									class="help-tip-text"
									role="tooltip"
									data-i18n="options.urlMatch.strictMode.desc"
									>启用后可减少版本号、统计数据等误匹配</span
								>
							</button>
						</div>
					</div>
					<div class="option-item">
						<div class="label-row">
							<label class="option-label">
								<input type="checkbox" id="excludeFileExt" checked />
								<span data-i18n="options.urlMatch.excludeFileExt"
									>排除文件扩展名</span
								>
							</label>
							<button
								type="button"
								class="help-tip"
								data-i18n-aria-label="common.help"
								aria-label="说明"
								aria-describedby="help-excludeFileExt"
							>
								<span class="help-tip-mark" aria-hidden="true">?</span>
								<span
									id="help-excludeFileExt"
									class="help-tip-text"
									role="tooltip"
									data-i18n="options.urlMatch.excludeFileExt.desc"
									>排除 .js, .css, .json 等常见文件扩展名</span
								>
							</button>
						</div>
					</div>
				</section>

				<section class="section">
					<h2 data-i18n="options.about.title">关于</h2>
					<div class="about-content">
						<p>
							<strong data-i18n="options.about.name"
								>智能超链接识别</strong
							>
							<span data-i18n="options.about.desc"
								>是一款高效的 Chrome 浏览器扩展程序。</span
							>
						</p>
						<p data-i18n="options.about.feature1">
							自动将网页中的纯文本 URL 转换为可点击的超链接
						</p>
						<p data-i18n="options.about.feature2">
							支持动态内容实时处理
						</p>
						<p data-i18n="options.about.feature3">
							所有操作在本地完成，不收集任何数据
						</p>
					</div>
				</section>
			</main>

			<footer>
				<button
					id="saveBtn"
					class="btn btn-primary"
					data-i18n="options.btn.save"
				>
					保存设置
				</button>
				<button
					id="resetBtn"
					class="btn btn-secondary"
					data-i18n="options.btn.reset"
				>
					恢复默认
				</button>
				<div id="saveStatus" class="save-status"></div>
			</footer>
		</div>

		<script src="lib/config.js"></script>
		<script src="i18n.js"></script>
		<script src="options.js"></script>
	</body>
</html>
